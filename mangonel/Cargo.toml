[package]
name = "mangonel"
version = "0.1.0"
edition = "2024"
license = { workspace = true }

[dependencies]
mangonel-libxdp = { workspace = true }
mangonel-nic = { workspace = true }

axum = { workspace = true, features = ["http1", "json", "tokio"] }
clap = { workspace = true, features = ["derive", "help", "std", "usage"] }
core_affinity = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "signal"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
