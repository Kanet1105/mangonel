[workspace]
resolver = "3"
members = [
    "mangonel",
    "mangonel-libxdp",
    "mangonel-libxdp-sys",
    "mangonel-nic",
]

# Matches libxdp, which mangonel links against. See LICENSE.
[workspace.package]
license = "LGPL-2.1 OR BSD-2-Clause"

[workspace.dependencies]
mangonel-libxdp = { path = "mangonel-libxdp" }
mangonel-libxdp-sys = { path = "mangonel-libxdp-sys" }
mangonel-nic = { path = "mangonel-nic" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
core_affinity = "0.8"
libc = "0.2"
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "signal"] }

# Numeric conversions in these crates cross kernel ABI widths (u32 ring
# indices, u64 umem addresses, usize lengths), so every lossy or
# platform-dependent cast should be deliberate rather than incidental.
[workspace.lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# The hot path spans three crates, so cross-crate inlining
# comes from LTO rather than per-function #[inline] hints.
[profile.release]
lto = true
codegen-units = 1
