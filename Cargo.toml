[workspace]
resolver = "3"
members = [
    "mangonel",
    "mangonel-libxdp",
    "mangonel-libxdp-sys",
    "mangonel-nic",
]

# Matches libxdp, which mangonel links against. See LICENSE.
[workspace.package]
license = "LGPL-2.1 OR BSD-2-Clause"

[workspace.dependencies]
mangonel-libxdp = { path = "mangonel-libxdp" }
mangonel-libxdp-sys = { path = "mangonel-libxdp-sys" }
mangonel-nic = { path = "mangonel-nic" }

# default-features = false throughout; each crate turns on the
# features it needs.
axum = { version = "0.8", default-features = false }
clap = { version = "4.6", default-features = false }
core_affinity = { version = "0.8", default-features = false }
libc = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", default-features = false }
toml = { version = "0.9", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }

# Numeric conversions in these crates cross kernel ABI widths (u32 ring
# indices, u64 umem addresses, usize lengths), so every lossy or
# platform-dependent cast should be deliberate rather than incidental.
[workspace.lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

# The hot path spans three crates, so cross-crate inlining
# comes from LTO rather than per-function #[inline] hints.
[profile.release]
lto = true
codegen-units = 1
